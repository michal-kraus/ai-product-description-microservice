services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      APP_ENV: prod
      APP_SECRET: ${APP_SECRET:-670f90c1e87383a8cfc65e8a5b28a8d1}
      REDIS_URL: redis://redis:6379
      MESSENGER_TRANSPORT_DSN: ${MESSENGER_TRANSPORT_DSN:-redis://redis:6379/messages}
      MESSENGER_TRANSPORT_DSN_FAILED: ${MESSENGER_TRANSPORT_DSN_FAILED:-redis://redis:6379/failed_messages}
      OLLAMA_URL: http://ai_local:11434
    depends_on:
      redis:
        condition: service_started
      ai_local:
        condition: service_started
      rabbitmq:
        condition: service_started
        required: false

  worker:
    build: .
    restart: unless-stopped
    command: php bin/console messenger:consume async --time-limit=3600 -vv
    environment:
      APP_ENV: prod
      APP_SECRET: ${APP_SECRET:-670f90c1e87383a8cfc65e8a5b28a8d1}
      REDIS_URL: redis://redis:6379
      MESSENGER_TRANSPORT_DSN: ${MESSENGER_TRANSPORT_DSN:-redis://redis:6379/messages}
      MESSENGER_TRANSPORT_DSN_FAILED: ${MESSENGER_TRANSPORT_DSN_FAILED:-redis://redis:6379/failed_messages}
      OLLAMA_URL: http://ai_local:11434
    depends_on:
      redis:
        condition: service_started
      ai_local:
        condition: service_started
      rabbitmq:
        condition: service_started
        required: false

  ai_local:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "21434:11434"
    volumes:
      - ./ollama_data:/root/.ollama

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    profiles:
      - rabbitmq
      - amqp
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
