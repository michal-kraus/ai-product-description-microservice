services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/app/public:ro
    depends_on:
      app:
        condition: service_started

  app:
    build: .
    restart: unless-stopped
    environment:
      APP_ENV: prod
      APP_SECRET: ${APP_SECRET:?APP_SECRET is required}
      DEFAULT_URI: http://localhost:8000
      REDIS_URL: redis://redis:6379
      MESSENGER_TRANSPORT_DSN: ${DOCKER_MESSENGER_TRANSPORT_DSN:-redis://redis:6379/messages}
      MESSENGER_TRANSPORT_DSN_FAILED: ${DOCKER_MESSENGER_TRANSPORT_DSN_FAILED:-redis://redis:6379/failed_messages}
      OLLAMA_URL: http://ai_local:11434
    depends_on:
      redis:
        condition: service_started
      ai_local:
        condition: service_started
      rabbitmq:
        condition: service_started
        required: false

  worker:
    build: .
    restart: unless-stopped
    command: php bin/console messenger:consume async --time-limit=3600 -vv
    environment:
      APP_ENV: prod
      APP_SECRET: ${APP_SECRET:?APP_SECRET is required}
      DEFAULT_URI: http://localhost:8000
      REDIS_URL: redis://redis:6379
      MESSENGER_TRANSPORT_DSN: ${DOCKER_MESSENGER_TRANSPORT_DSN:-redis://redis:6379/messages}
      MESSENGER_TRANSPORT_DSN_FAILED: ${DOCKER_MESSENGER_TRANSPORT_DSN_FAILED:-redis://redis:6379/failed_messages}
      OLLAMA_URL: http://ai_local:11434
    depends_on:
      redis:
        condition: service_started
      ai_local:
        condition: service_started
      rabbitmq:
        condition: service_started
        required: false

  ai_local:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ./ollama_data:/root/.ollama

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    profiles:
      - rabbitmq
      - amqp
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
