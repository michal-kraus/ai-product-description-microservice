# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    env(AI_PROVIDER): 'ollama'
    env(OLLAMA_URL): 'http://127.0.0.1:21434'
    env(OLLAMA_MODEL): 'qwen2.5:0.5b'
    env(OLLAMA_TEMPERATURE): '0.7'
    env(GEMINI_API_KEY): ''
    env(GEMINI_MODEL): 'gemini-3.1-flash-lite-preview'
    env(GEMINI_BASE_URL): 'https://generativelanguage.googleapis.com/v1beta/interactions'
    env(AI_PROMPT_TEMPLATE): "Jesteś copywriterem e-commerce. Napisz krótki i atrakcyjny opis produktu po polsku:\nNazwa: {name}\nCechy: {features}"

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    App\AI\Prompt\PromptBuilder:
        arguments:
            $template: '%env(AI_PROMPT_TEMPLATE)%'

    App\AI\Client\OllamaClient:
        arguments:
            $ollamaUrl: '%env(OLLAMA_URL)%'
            $model: '%env(OLLAMA_MODEL)%'
            $temperature: '%env(float:OLLAMA_TEMPERATURE)%'

    App\AI\Client\GeminiClient:
        arguments:
            $apiKey: '%env(GEMINI_API_KEY)%'
            $model: '%env(GEMINI_MODEL)%'
            $baseUrl: '%env(GEMINI_BASE_URL)%'

    App\AI\Factory\AIClientFactory:
        arguments:
            $provider: '%env(AI_PROVIDER)%'

    App\AI\Client\AIClientInterface:
        factory: ['@App\AI\Factory\AIClientFactory', 'create']